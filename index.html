<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Candy Clicker</title><style>*{box-sizing:border-box;margin:0;padding:0;user-select:none;}body{height:100vh;background:radial-gradient(circle,#d8a0f8,#a777eb);font-family:Arial,sans-serif;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:12px;padding:15px;overflow:hidden;}.tp{display:flex;flex-direction:column;align-items:center;gap:6px;z-index:10;margin-top:5px;}.sc{background:rgba(255,255,255,0.4);padding:8px 35px;border-radius:22px;}.score{font-size:42px;font-weight:900;}.hud{display:flex;gap:8px;background:rgba(0,0,0,0.25);padding:4px 12px;border-radius:12px;font-size:13px;color:#fff;}.bdg{display:flex;flex-direction:column;gap:3px;align-items:center;max-height:80px;overflow-y:auto;}.ca{width:180px;height:180px;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;z-index:20;}.cnd{width:150px;transition:transform 0.08s;}.ca:active .cnd{transform:scale(0.88);}.gc{position:absolute;width:55px;height:55px;cursor:pointer;z-index:50;filter:drop-shadow(0 0 10px #ffe600);animation:fl 0.6s infinite alternate;}.wc{filter:drop-shadow(0 0 10px #f00) invert(20%) sepia(90%) saturate(7000%);}@keyframes fl{0%{transform:translateY(0);}100%{transform:translateY(-8px);}}.ft{position:absolute;font-weight:900;font-size:18px;color:#ff0;text-shadow:2px 2px 0 #000;pointer-events:none;animation:fu 1s forwards;z-index:60;}@keyframes fu{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-50px);}}.btn{background:linear-gradient(180deg,#ffb2e6,#ff7bc3);border:3px solid #000;border-radius:14px;box-shadow:0 3px 0 #000;cursor:pointer;font-weight:bold;z-index:30;}.btn:active{transform:translateY(3px);box-shadow:0 0 0 #000;}.md{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;z-index:100;}.bx{background:#f7dfff;border:4px solid #000;border-radius:18px;width:95%;max-width:440px;padding:16px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}.tbs{display:flex;gap:4px;}.tb{flex:1;background:#e2c4ff;border:2px solid #000;border-radius:6px;padding:6px;font-size:12px;font-weight:bold;cursor:pointer;text-align:center;}.tb.active{background:#ff7bc3;color:#fff;}.tc{display:none;flex-direction:column;gap:6px;}.tc.active{display:flex;}.itm{background:#fff;border:2px solid #000;border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;font-size:13px;}.itm h4{font-size:14px;margin-bottom:2px;}.itm p{font-size:11px;color:#555;}.by{background:#4ceb53;border:2px solid #000;border-radius:6px;padding:5px 9px;font-weight:bold;cursor:pointer;font-size:11px;white-space:nowrap;}</style></head><body><div class="tp"><div class="sc"><div id="sD" class="score">0</div></div><div class="hud"><span id="hP">Power: 1</span><span>•</span><span id="hC">CPS: 0</span></div><div class="bdg" id="bC"></div></div><div class="ca" onclick="clk()"><svg class="cnd" viewBox="0 0 200 120"><path d="M30 40 L60 60 L30 80 Z" fill="#ff7bc3" stroke="#000" stroke-width="4"/><path d="M170 40 L140 60 L170 80 Z" fill="#ff7bc3" stroke="#000" stroke-width="4"/><circle cx="100" cy="60" r="45" fill="url(#cg)" stroke="#000" stroke-width="5"/><defs><radialGradient id="cg" cx="40%" cy="40%" r="60%"><stop offset="0%" stop-color="#3bf0ff"/><stop offset="100%" stop-color="#006ce3"/></radialGradient></defs></svg></div><div style="display:flex;gap:10px;width:100%;max-width:280px;justify-content:space-between;position:relative;z-index:30;margin-top:-5px;"><button class="btn" style="width:100px;height:38px;font-size:14px;" onclick="op()">SHOP</button><button class="btn" id="saveBtn" style="width:38px;height:38px;font-size:16px;">💾</button></div><div class="md" id="md"><div class="bx"><div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;padding-bottom:6px;"><h2>Candy Shop</h2><button onclick="cl()" style="background:#ff5e5e;border:2px solid #000;border-radius:6px;width:26px;height:26px;font-weight:bold;cursor:pointer;">X</button></div><div class="tbs"><button class="tb active" id="t1" onclick="st(1)">Upgrades</button><button class="tb" id="t2" onclick="st(2)">Perms</button><button class="tb" id="t3" onclick="st(3)">Rebirth</button><button class="tb" id="t4" onclick="st(4)">Trophies</button></div><div class="tc active" id="c1"><div class="itm"><div><h4>Click Power</h4><p id="pTxt">Power: 1</p></div><button class="by" id="bPBtn" onclick="bP()">Cost: 10</button></div><div class="itm"><div><h4>Auto Clicker</h4><p id="aTxt">CPS: 0</p></div><button class="by" id="bABtn" onclick="bA()">Cost: 50</button></div><div class="itm"><div><h4>Golden Switch</h4><p id="gsTxt">OFF (+50% CPS)</p></div><button class="by" id="gsBtn" onclick="tGS()">Toggle</button></div></div><div class="tc" id="c2"><div class="itm" style="background:#e8f4ff;border-color:#05a;"><div><h4>Perm Click</h4><p id="pcTxt">1x</p></div><button class="by" id="bPCBtn" style="background:#08f;color:#fff;" onclick="bPC()">Cost: 1Qi</button></div><div class="itm" style="background:#e8f4ff;border-color:#05a;"><div><h4>Perm CPS</h4><p id="psTxt">1x</p></div><button class="by" id="bPSBtn" style="background:#08f;color:#fff;" onclick="bPS()">Cost: 1Qi</button></div></div><div class="tc" id="c3"><div class="itm" style="background:#fff3c4;border-color:#d48800;"><div><h4>Rebirth</h4><p id="rTxt">2x</p></div><button class="by" id="bRbBtn" onclick="bRb()">Cost: 10M</button></div><div class="itm" style="background:#e0c4ff;border-color:#50a;"><div><h4>Super Rebirth</h4><p id="srTxt">100x</p></div><button class="by" id="bSRbBtn" style="background:#80a;color:#fff;" onclick="bSRb()">Cost: 100Sx</button></div><div class="itm" style="background:#fee;border-color:#c00;"><div><h4>Wipe Data</h4><p>Reset all</p></div><button class="by" style="background:#e00;color:#fff;" onclick="wipeData()">Wipe</button></div></div><div class="tc" id="c4"><div id="achCon" style="display:flex;flex-direction:column;gap:5px;"></div></div></div></div><script>let s=0,p=1,pc=10,a=0,ac=50,pcm=1,pcc=1e18,pcmc=1,pcmcc=1e18,rb=0,rbm=1,rbc=1e7,srb=0,srbm=1,srbc=1e23,gs=false,totC=0,totM=0;let ft=0,fm=1,dht=0,dhm=1,srt=0,srm=1,cmt=0,cmm=1,dft=0,dfm=1,cft=0,cfm=1;let clt=0,clm=1,dnt=0,dnm=1,cft2=0,cf2m=1,hwt=0,hwm=1,txt=0,txm=1,eft=0,efm=1;let candyTimer=0;let isWiping=false;const aD={};['c','m','r'].forEach(t=>{for(let i=1;i<=17;i++){if(t==='r'&&i>16)break;let k=t+i,n=['First Click','Century','Millennium','Ten Grand','Click Master','Click Legend','Click God','Click Titan','Click Omni','Click Eternal','Click Infinite','Click Beyond','Click Supreme','Click Ultimate','Click Zenith','Click Apex','Click Omega'][i-1];if(t==='m')n=['Sweet Tooth','Hoarder','Billionaire','Trillionaire','Quadrillionaire','Quintillionaire','Sextillionaire','Septillionaire','Octillionaire','Nonillionaire','Decillionaire','Undecillionaire','Duodecillionaire','Tredecillionaire','Quattuordecillionaire','Quindecillionaire','Sexdecillionaire'][i-1];if(t==='r')n=['Reborn','Rebirth Vet','Rebirth Master','Rebirth Legend','Rebirth God','Rebirth Titan','Rebirth Omni','Rebirth Eternal','Rebirth Infinite','Rebirth Beyond','Rebirth Supreme','Rebirth Ultimate','Rebirth Zenith','Rebirth Apex','Rebirth Transcend','Rebirth Sovereign'][i-1];let v=Math.pow(10,i>1?i*2:0);if(t==='c')v=i===1?1:Math.pow(10,i-1)*(i>5?1000:10);if(t==='r')v=i;aD[k]=[n,`Milestone ${i}`,0.01,()=>t==='c'?totC>=v:t==='m'?totM>=v:rb>=v];}});let ach={};Object.keys(aD).forEach(k=>ach[k]=false);function loadG(){try{let d=JSON.parse(localStorage.getItem('cc_v11')||'{}');s=d.s||0;p=d.p||1;pc=d.pc||10;a=d.a||0;ac=d.ac||50;pcm=d.pcm||1;pcc=d.pcc||1e18;pcmc=d.pcmc||1;pcmcc=d.pcmcc||1e18;rb=d.rb||0;rbm=d.rbm||1;rbc=d.rbc||1e7;srb=d.srb||0;srbm=d.srbm||1;srbc=d.srbc||1e23;gs=!!d.gs;totC=d.totC||0;totM=d.totM||0;if(d.ach)ach=d.ach;}catch(e){}}function saveG(){if(isWiping)return;localStorage.setItem('cc_v11',JSON.stringify({s,p,pc,a,ac,pcm,pcc,pcmc,pcmcc,rb,rbm,rbc,srb,srbm,srbc,gs,totC,totM,ach}));}loadG();document.getElementById('saveBtn').addEventListener('click', () => {saveG();sf('💾 Saved!');});function wipeData(){if(confirm('Are you sure you want to wipe all data?')) {isWiping=true;localStorage.removeItem('cc_v11');localStorage.clear();location.reload();}}function fn(n){if(n<1e3)return Math.floor(n);let u=["k","m","b","t","qa","qi","sx","Sp","O","N","Dc","Ud","Dd","Td","Qad","Qid","Sxd","Spd","Od","Nd","Vg","uVg","dVg","tVg","qaVg","qiVg","sxVg","spVg","oVg","nVp","Tg","uTg","dTg","tTg","qaTg","qiTg","sxTg","spTg","oTg","nTg","Qag","uQag","dQag","tQag","qaQag","qiQag","sxQag","spQag","oQag","nQag","Qig","uQig","dQig","tQig","qaQig","qiQig","sxQig","spQig","oQig","nQig","Sxg","uSxg","dSxg","tSxg","qaSxg","qiSxg","sxSxg","spSxg","oSxg","nSxg","Spg","uSpg","dSpg","tSpg","qaSpg","qiSpg","sxSpg","spSpg","oSpg","nSpg","Og","uOg","dOg","tOg","qaOg","qiOg","sxOg","spOg","oOg","nOg","Ng","uNg","dNg","tNg","qaNg","qiNg","sxNg","spNg","oNg","nNg","Ce"],i=Math.min(Math.floor(Math.log10(n)/3),u.length);return(n/Math.pow(10,i*3)).toFixed(1)+u[i-1];}function getAchM(){let m=1;for(let k in aD)if(ach[k])m+=aD[k][2];return m;}function getM(){let sb=gs?1.5:1;let baseM=rbm*srbm*pcmc*pcm*fm*dhm*srm*cmm*dfm*cfm*sb*getAchM()*hwm*txm*efm;return baseM*clm;}function getFinalClick(){let baseClick=p*pcm;if(dnt>0)return (a*getM())*(cf2m>1?20:1);return (baseClick*dfm*cf2m*(cf2m>1?20:1));}function getFinalCPS(){if(cft2>0)return 0;if(dnt>0)return p*pcm*getM();return (a*getM()*txm);}function getGSCost(){return Math.max(1000, Math.floor(getFinalCPS() * 3600));}function upUI(){document.getElementById('sD').innerText=fn(s);document.getElementById('hP').innerText=`Power: ${fn(getFinalClick())}`;document.getElementById('hC').innerText=`CPS: ${fn(getFinalCPS())}`;document.getElementById('pTxt').innerText=`Power: ${fn(p)}`;document.getElementById('bPBtn').innerText=`Cost: ${fn(pc)}`;document.getElementById('aTxt').innerText=`CPS: +${fn(a)}`;document.getElementById('bABtn').innerText=`Cost: ${fn(ac)}`;document.getElementById('bPCBtn').innerText=`Cost: ${fn(pcc)}`;document.getElementById('bPSBtn').innerText=`Cost: ${fn(pcmcc)}`;document.getElementById('gsBtn').innerText=gs?`ON`:`Cost: ${fn(getGSCost())}`;document.getElementById('gsTxt').innerText=gs?`Active (+50% CPS)`:`OFF`;document.getElementById('bRbBtn').innerText=`Cost: ${fn(rbc)}`;document.getElementById('bSRbBtn').innerText=`Cost: ${fn(srbc)}`;document.getElementById('rTxt').innerText=`${fn(rbm)}x`;document.getElementById('srTxt').innerText=`${fn(srbm)}x`;chkAch();upAchUI();}function chkAch(){for(let k in aD){if(!ach[k]&&aD[k][3]()){ach[k]=true;sf(`🏆 ${aD[k][0]}!`);}}}function upAchUI(){let h='';for(let k in aD){let u=ach[k],v=aD[k];h+=`<div class="itm" style="background:${u?'#eafbe7':'#eee'}"><div><h4>${v[0]}</h4><p>${v[1]}</p></div><span style="font-size:10px;font-weight:bold;">${u?'UNLOCKED':'LOCKED'}</span></div>`;}document.getElementById('achCon').innerHTML=h;}function sf(txt){let e=document.createElement('div');e.className='ft';e.innerText=txt;e.style.left=`${Math.random()*120+40}px`;e.style.top=`90px`;document.body.appendChild(e);setTimeout(()=>e.remove(),1000);}function clk(){let g=getFinalClick();s+=g;totM+=g;totC++;upUI();}function op(){document.getElementById('md').style.display='flex';upUI();}function cl(){document.getElementById('md').style.display='none';}function st(n){[1,2,3,4].forEach(i=>{document.getElementById(`t${i}`).className=`tb${n===i?' active':''}`;document.getElementById(`c${i}`).className=`tc${n===i?' active':''}`;});}function bP(){if(s>=pc){s-=pc;p=Math.max(p + 1, Math.round(p * 1.3));pc=Math.floor(pc*1.6);upUI();}}function bA(){if(s>=ac){s-=ac;a=a===0 ? 1 : Math.max(a + 1, Math.round(a * 1.3));ac=Math.floor(ac*1.5);upUI();}}function bPC(){if(s>=pcc){s-=pcc;pcm*=2;pcc*=1000;upUI();}}function bPS(){if(s>=pcmcc){s-=pcmcc;pcmc*=2;pcmcc*=1000;upUI();}}function tGS(){let cost=getGSCost();if(!gs){if(s>=cost){s-=cost;gs=true;let old=document.querySelector('.gc');if(old)old.remove();upUI();}else{sf('Need more candy!');}}else{gs=false;spawnCandyEntity(true);candyTimer=0;upUI();}}function resetRun(){s=0;p=1;pc=10;a=0;ac=50;gs=false;candyTimer=0;ft=0;fm=1;dht=0;dhm=1;srt=0;srm=1;cmt=0;cmm=1;dft=0;dfm=1;cft=0;cfm=1;clt=0;clm=1;dnt=0;cft2=0;cf2m=1;hwt=0;hwm=1;txt=0;txm=1;eft=0;efm=1;}function bRb(){if(s>=rbc){resetRun();rb++;rbm*=2;rbc*=40;upUI();alert('Rebirth successful!');}}function bSRb(){if(s>=srbc){resetRun();rb=0;rbm=1;srb++;srbm*=100;srbc*=1e8;upUI();alert('Super Rebirth successful!');}}function spawnCandyEntity(forceGolden=false){if(gs && !forceGolden) return;let old=document.querySelector('.gc');if(old)old.remove();let isWrath=forceGolden?false:(Math.random()>=0.8),el=document.createElement('div');el.className=isWrath?'gc wc':'gc';el.style.left=`${Math.random()*(window.innerWidth-60)+20}px`;el.style.top=`${Math.random()*(window.innerHeight-150)+60}px`;el.innerHTML=`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="${isWrath?'#f00':'#ffcc00'}" stroke="#000" stroke-width="6"/></svg>`;el.onclick=()=>{el.remove();let r=Math.random()*100;if(isWrath){if(r<1){p=Math.max(1,p-5);a=Math.max(0,a-5);pc=Math.max(10,Math.round(pc*0.8));ac=Math.max(50,Math.round(ac*0.8));sf('BAD GRANDMA!');}else if(r<16){clm=0.5;clt=120;sf('CLOT!');}else if(r<31){dnt=90;sf('DREADFUL NIGHT!');}else if(r<46){cf2m=20;cft2=25;sf('CURSED FINGER!');}else if(r<61){hwm=300;hwt=5;sf('HALLOWEEN!');}else if(r<76){txm=1/9;txt=30;sf('TOXIC SAUCE!');}else if(r<91){efm=666;eft=15;sf('ELDER FRENZY!');}else{sf('GAG (Harmless)!');}}else{if(r<16){fm=7;ft=180;sf('FRENZY!');}else if(r<33){dhm=11;dht=180;sf('DRAGON HARVEST!');}else if(r<50){srm=50;srt=45;sf('SUGAR RUSH!');}else if(r<66){cmm=9;cmt=60;sf('CARMEL SAUCE!');}else if(r<83){dfm=1223;dft=15;sf('DRAGON FLIGHT!');}else{cfm=777;cft=10;sf('CLICK FRENZY!');}}upUI();};document.body.appendChild(el);setTimeout(()=>el.remove(),12000);}setInterval(()=>{if(!gs){candyTimer++;if(candyTimer>=120){candyTimer=0;spawnCandyEntity(false);}}},1000);setInterval(()=>{let dec=(t)=>(t>0?t-1:0);ft=dec(ft);if(!ft)fm=1;dht=dec(dht);if(!dht)dhm=1;srt=dec(srt);if(!srt)srm=1;cmt=dec(cmt);if(!cmt)cmm=1;dft=dec(dft);if(!dft)dfm=1;cft=dec(cft);if(!cft)cfm=1;clt=dec(clt);if(!clt)clm=1;dnt=dec(dnt);cft2=dec(cft2);if(!cft2)cf2m=1;hwt=dec(hwt);if(!hwt)hwm=1;txt=dec(txt);if(!txt)txm=1;eft=dec(eft);if(!eft)efm=1;},1000);setInterval(()=>{let currentCPS=getFinalCPS();if(currentCPS>0){s+=(currentCPS/100);totM+=(currentCPS/100);upUI();saveG();}},10);upUI();</script></body></html>
